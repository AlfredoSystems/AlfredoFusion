sentence=IMU drivers (LSM6 family, H3LIS331DL, MMC5983MA) and VQF sensor fusion with automatic gyro bias calibration.
paragraph=Short, simple drivers for the ST LSM6 accelerometer/gyroscope family, the ST H3LIS331DL high-g accelerometer and the MEMSIC MMC5983MA magnetometer, plus the VQF orientation filter (Laidig and Seel 2023): quaternion and yaw/pitch/roll from any IMU, with gyro bias learned automatically whenever the sensor rests. Used by the Alfredo-NoU3 and SimpleMelt libraries.
